version: "0.1.0"
type: plugin
author: "Whatsonyourmind"
name: "oraclaw"
label:
  en_US: "OraClaw Decision Intelligence"
description:
  en_US: "5 mathematical decision-intelligence tools for Dify workflows: Multi-Armed Bandit (UCB1/Thompson/ε-greedy arm selection), LP/MIP Solver (budget allocation, scheduling, constraint satisfaction), Graph Analytics (PageRank/communities/shortest path), Anomaly Detection (Z-score/IQR), Time Series Forecast (ARIMA/Holt-Winters with confidence intervals). All under 25ms via the OraClaw REST API."
created_at: "2026-04-05T00:00:00Z"
icon: "icon.svg"
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
meta:
  version: "0.0.1"
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: "main"
plugins:
  tools:
    - "provider/oraclaw.yaml"
privacy: "privacy.md"
